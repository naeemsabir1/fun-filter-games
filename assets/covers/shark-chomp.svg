    <polygon points="114,75 128,10 142,75" fill="#FFFFFF" stroke="#181226" stroke-width="4"/>
    <polygon points="162,72 176,20 190,70" fill="#FFFFFF" stroke="#181226" stroke-width="4"/>
  </g>
