<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
  <defs>
    <linearGradient id="oceanCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
  </defs>
  <rect width="320" height="480" rx="36" fill="url(#oceanCover)"/>
  <!-- Bubbles floating -->
  <circle cx="60" cy="140" r="18" fill="#E0F2FE" opacity="0.4"/>
  <circle cx="260" cy="220" r="14" fill="#E0F2FE" opacity="0.4"/>
  <!-- Fish swimming through center -->
