  <ellipse cx="160" cy="170" rx="55" ry="15" fill="none" stroke="#EA580C" stroke-width="7"/>
  <!-- Ball flying -->
  <circle cx="160" cy="300" r="45" fill="#F97316" stroke="#181226" stroke-width="6"/>
  <line x1="115" y1="300" x2="205" y2="300" stroke="#181226" stroke-width="5"/>
